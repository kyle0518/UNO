[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
ts-rs = { version = "12", features = ["serde-compat"] }
proptest = "1"

[profile.release]
lto = "thin"

[profile.release.package.uno-wasm]
opt-level = "s"
